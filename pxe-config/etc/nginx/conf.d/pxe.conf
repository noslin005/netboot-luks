server {
    listen 443 ssl http2;
    server_name 10.12.0.100 pxe-server.corp.nmlhq.com;

    ssl_certificate     /etc/pki/tls/certs/pxe-server.crt;
    ssl_certificate_key /etc/pki/tls/private/pxe-server.key;

    # Recommended modern TLS baseline (optional but good practice)
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/pxe;
    autoindex off;

    sendfile on;
    tcp_nopush on;

    location /ipxe/ {
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }

    location /images/ {
        default_type application/octet-stream;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Accept-Ranges bytes;
    }

    location /tang/ {
        proxy_pass http://127.0.0.1:7500/;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    access_log /var/log/nginx/nginx-access.log;
    error_log  /var/log/nginx/nginx-error.log;
}

server {
    listen 80;
    server_name 10.12.0.100 pxe-server.corp.nmlhq.com;

    root /srv/pxe;
    autoindex off;

    sendfile on;
    tcp_nopush on;

    # Optional but recommended: redirect everything to HTTPS
    # If you truly need HTTP boot, remove this line
    #return 301 https://$host$request_uri;

    location /ipxe/ {
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }

    location /images/ {
        default_type application/octet-stream;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Accept-Ranges bytes;
    }
}
